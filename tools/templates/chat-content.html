<div class="chat-page">

    <h2>Asistente IA</h2>

    <p>
        Bienvenido al asistente de EQui-T. Utilice este chat para consultar el catálogo de criterios y recibir recomendaciones sobre recursos educativos accesibles.
    </p>

    <div id="chat-app">

        <div id="chat-messages"></div>

        <form id="chat-form">

            <div class="form-group">

                <label for="chat-input">
                    Escriba su consulta
                </label>

                <textarea
                    id="chat-input"
                    class="form-control"
                    rows="5"
                    placeholder="Escriba aquí su consulta..."
                ></textarea>

            </div>

            <br>

            <button
                id="chat-send"
                type="submit"
                class="btn btn-primary"
            >
                Enviar
            </button>

        </form>

    </div>

</div>
