name: tfm-AI

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.node

    container_name: tfm-backend

    working_dir: /app

    ports:
      - "3000:3000"

    volumes:
      - ./backend/node:/app
      - node-modules:/app/node_modules
      - ./web:/web

    env_file:
      - ./backend/.env

    depends_on:
      python-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  python-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.python

    container_name: tfm-python-api

    working_dir: /app

    command: uvicorn semantic_search_api:app --reload --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    volumes:
      - ./backend/python:/app
      - ./backend/data:/app/data
      - hf-cache:/root/.cache/huggingface

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.status==200 else 1)"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.7.1

    container_name: tfm-cloudflared

    env_file:
      - ./backend/.env

    command:
      - tunnel
      - --no-autoupdate
      - run

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  node-modules:
  hf-cache: